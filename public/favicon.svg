<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Premium Indigo Gradient for Trust, Marketing, and Digital Core -->
    <linearGradient id="indigoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>
    <!-- Metallic Gold Gradient for High Value, Authority, and Analytics ROI -->
    <linearGradient id="goldGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#AA7C11" />
      <stop offset="30%" stop-color="#D4AF37" />
      <stop offset="70%" stop-color="#F3D078" />
      <stop offset="100%" stop-color="#FFF3B0" />
    </linearGradient>
    <!-- Soft background glow -->
    <radialGradient id="innerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Base Rounded Container (Rich Dark Slate to match the premium contrast on any browser tab) -->
  <rect width="128" height="128" rx="36" fill="#0F172A" />

  <!-- Ambient Glow -->
  <circle cx="64" cy="64" r="50" fill="url(#innerGlow)" />

  <!-- Decorative Outer Ring in Gold -->
  <rect x="6" y="6" width="116" height="116" rx="30" fill="none" stroke="url(#goldGrad)" stroke-width="2" opacity="0.4" />

  <!-- The Speaker Silhouette & Microphone Design (Inspired by the photo of Madhan Prakash speaking on stage) -->
  <g transform="translate(14, 14)">
    <!-- Stage / Background Spotlight Circle in Indigo -->
    <circle cx="50" cy="50" r="42" fill="url(#indigoGrad)" opacity="0.95" />

    <!-- Stylized outline of growth waves (Digital Marketing) -->
    <path d="M15,50 Q30,35 50,50 T85,50" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.5" />
    <path d="M15,60 Q30,45 50,60 T85,60" fill="none" stroke="#6366F1" stroke-width="2" opacity="0.3" />

    <!-- Stylized Portrait/Silhouette of Speaker (from the photo: looking slightly right, holding mic) -->
    <!-- Shoulders and Torso -->
    <path d="M26,85 C26,68 38,58 50,58 C62,58 74,68 74,85 Z" fill="#0F172A" opacity="0.9" />
    <path d="M26,85 C26,68 38,58 50,58 C62,58 74,68 74,85 Z" fill="none" stroke="url(#goldGrad)" stroke-width="2" />
    
    <!-- Checked Plaid Shirt Details (inspired by the photo's plaid shirt pattern) -->
    <path d="M38,62 L38,85" stroke="url(#goldGrad)" stroke-width="1" opacity="0.4" />
    <path d="M50,58 L50,85" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.6" />
    <path d="M62,62 L62,85" stroke="url(#goldGrad)" stroke-width="1" opacity="0.4" />
    <path d="M30,70 L70,70" stroke="url(#goldGrad)" stroke-width="1" opacity="0.4" />
    <path d="M28,78 L72,78" stroke="url(#goldGrad)" stroke-width="1" opacity="0.4" />

    <!-- Head and Neck -->
    <rect x="45" y="44" width="10" height="15" rx="2" fill="#0F172A" stroke="url(#goldGrad)" stroke-width="2" />
    <circle cx="50" cy="36" r="14" fill="#0F172A" stroke="url(#goldGrad)" stroke-width="2" />

    <!-- Speaker's Hand & Microphone (holding mic in front of face/mouth) -->
    <g transform="translate(42, 38)">
      <!-- Hand / Fist holding mic -->
      <circle cx="-12" cy="14" r="5" fill="url(#goldGrad)" />
      <!-- Mic handle -->
      <line x1="-12" y1="14" x2="-2" y2="4" stroke="#FAFAF9" stroke-width="3.5" stroke-linecap="round" />
      <!-- Mic capsule (gold grille) -->
      <circle cx="-1" cy="3" r="5.5" fill="url(#goldGrad)" />
      <!-- Small mic highlight -->
      <circle cx="-1" cy="3" r="3" fill="#FFF3B0" opacity="0.5" />
    </g>

    <!-- Marketing Growth Arrow extending from the mic waves upward (symbolizing Digital Marketing ROI and optimization) -->
    <path d="M72,24 L86,10 M86,10 L74,10 M86,10 L86,22" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
